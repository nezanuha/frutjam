name: Blog post pitch
description: Propose an article for the Frutjam blog
title: "Blog pitch: "
labels: ["blog", "content"]
body:
  - type: markdown
    attributes:
      value: |
        The Frutjam blog takes guest posts about building UIs with CSS-only
        components: tutorials, migration write-ups, comparisons, accessibility
        work. Pitch here and we'll reply on this issue.

        Posts are published in English at frutjam.com/blog with a byline and a
        link back to you.
  - type: input
    id: title
    attributes:
      label: Working title
      placeholder: Building a dashboard with Frutjam and HTMX
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What the article covers
      description: A short outline — the problem, what a reader learns, and roughly how long it will be.
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: Who it is for
      placeholder: Django developers moving off Bootstrap
    validations:
      required: true
  - type: textarea
    id: writing
    attributes:
      label: Something you have written before
      description: A link or two, if you have them. Not required.
    validations:
      required: false
  - type: input
    id: byline
    attributes:
      label: Byline and link
      description: The name and site or profile you want credited.
    validations:
      required: false
